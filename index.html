<script>
window.onerror = function(msg, url, line) {
    const out = document.getElementById("truthModeResults");
    if (out) out.innerHTML = `<span style="color:#ff5252;">Script Error (line ${line}): ${msg}</span>`;
};

function parseTimestampMs(raw) {
    if (!raw) return NaN;
    let s = String(raw).trim();
    if (/^\d{4}\.\d{2}\.\d{2}/.test(s)) {
        s = s.replace(/\./g, "-").replace(" ", "T");
    }
    let t = Date.parse(s);
    if (!isNaN(t)) return t;
    let parts = s.split(/[-T :]/);
    if (parts.length >= 3) {
        let y = parseInt(parts[0], 10);
        let m = parseInt(parts[1], 10) - 1;
        let d = parseInt(parts[2], 10);
        let hr = parseInt(parts[3] || "0", 10);
        let mn = parseInt(parts[4] || "0", 10);
        return new Date(y, m, d, hr, mn, 0).getTime();
    }
    return NaN;
}

function parseCSVText(text) {
    if (!text || !text.trim()) return [];
    let lines = text.trim().split(/\r?\n/);
    let candles = [];
    for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line || line.toLowerCase().startsWith("time")) continue;
        let cols = line.split(/,|\t/);
        if (cols.length >= 5) {
            let timeVal = parseTimestampMs(cols[0]);
            let open = parseFloat(cols[1]);
            let high = parseFloat(cols[2]);
            let low = parseFloat(cols[3]);
            let close = parseFloat(cols[4]);
            if (isNaN(timeVal) || isNaN(open) || isNaN(high) || isNaN(low) || isNaN(close)) continue;
            candles.push({
                timeStr: cols[0].trim(),
                time: timeVal,
                open: open,
                high: high,
                low: low,
                close: close,
                volume: parseFloat(cols[5]) || 0
            });
        }
    }
    return candles.sort((a, b) => a.time - b.time);
}

function analyzeCandleMomentum(c, prev, prev2, avgVol) {
    let body = Math.abs(c.close - c.open);
    let totalRange = c.high - c.low;
    if (totalRange === 0) {
        return { dir: 'neutral', role: 'COMPRESSION', momentum: 10, name: 'Doji (Zero Range)' };
    }

    let upperWick = c.high - Math.max(c.open, c.close);
    let lowerWick = Math.min(c.open, c.close) - c.low;
    let bodyRatio = body / totalRange;
    let isBull = c.close > c.open;
    let isBear = c.close < c.open;

    let volBoost = (avgVol > 0 && c.volume > 0) ? Math.min(10, Math.max(-5, Math.round(((c.volume - avgVol) / avgVol) * 8))) : 0;
    let baseMomentum = Math.min(99, Math.max(15, Math.round(bodyRatio * 85 + volBoost)));

    let prevBody = prev ? Math.abs(prev.close - prev.open) : 0;
    let prevIsBull = prev ? prev.close > prev.open : false;
    let prevIsBear = prev ? prev.close < prev.open : false;

    if (prev && prev2) {
        let p2Body = Math.abs(prev2.close - prev2.open);
        let p2Range = prev2.high - prev2.low;
        let mid2 = (prev2.open + prev2.close) / 2;
        if (prev2.close < prev2.open && p2Body > p2Range * 0.45 && prevBody < p2Body * 0.45 && isBull && c.close > mid2) {
            return { dir: 'bull', role: 'REVERSAL', momentum: Math.min(98, 88 + volBoost), name: 'Morning Star (Bullish Reversal)' };
        }
        if (prev2.close > prev2.open && p2Body > p2Range * 0.45 && prevBody < p2Body * 0.45 && isBear && c.close < mid2) {
            return { dir: 'bear', role: 'REVERSAL', momentum: Math.min(98, 88 + volBoost), name: 'Evening Star (Bearish Reversal)' };
        }
    }

    if (prev) {
        if (isBull && prevIsBear && c.close >= prev.open && c.open <= prev.close && body >= prevBody * 0.95) {
            return { dir: 'bull', role: 'REVERSAL', momentum: Math.min(98, Math.max(76, baseMomentum + 10)), name: 'Bullish Engulfing (Reversal)' };
        }
        if (isBear && prevIsBull && c.close <= prev.open && c.open >= prev.close && body >= prevBody * 0.95) {
            return { dir: 'bear', role: 'REVERSAL', momentum: Math.min(98, Math.max(76, baseMomentum + 10)), name: 'Bearish Engulfing (Reversal)' };
        }
        if (isBull && prevIsBear && Math.abs(c.low - prev.low) <= totalRange * 0.10 && bodyRatio >= 0.4) {
            return { dir: 'bull', role: 'REVERSAL', momentum: Math.min(92, Math.max(74, baseMomentum + 6)), name: 'Tweezer Bottom (Reversal)' };
        }
        if (isBear && prevIsBull && Math.abs(c.high - prev.high) <= totalRange * 0.10 && bodyRatio >= 0.4) {
            return { dir: 'bear', role: 'REVERSAL', momentum: Math.min(92, Math.max(74, baseMomentum + 6)), name: 'Tweezer Top (Reversal)' };
        }
    }

    if (bodyRatio <= 0.15 && lowerWick >= totalRange * 0.60) {
        return { dir: 'bull', role: 'REVERSAL', momentum: Math.min(94, Math.max(75, Math.round((lowerWick / totalRange) * 95) + volBoost)), name: 'Dragonfly Doji (Bullish Reversal)' };
    }
    if (bodyRatio <= 0.15 && upperWick >= totalRange * 0.60) {
        return { dir: 'bear', role: 'REVERSAL', momentum: Math.min(94, Math.max(75, Math.round((upperWick / totalRange) * 95) + volBoost)), name: 'Gravestone Doji (Bearish Reversal)' };
    }

    if (lowerWick >= body * 2.0 && lowerWick >= totalRange * 0.50) {
        let revMom = Math.min(95, Math.max(68, Math.round((lowerWick / totalRange) * 92) + (isBull ? 8 : 0) + volBoost));
        return { dir: 'bull', role: 'REVERSAL', momentum: revMom, name: isBull ? 'Bullish Hammer / Pin Bar (Reversal)' : 'Inverted/Hammer Wick Rejection (Reversal)' };
    }
    if (upperWick >= body * 2.0 && upperWick >= totalRange * 0.50) {
        let revMom = Math.min(95, Math.max(68, Math.round((upperWick / totalRange) * 92) + (isBear ? 8 : 0) + volBoost));
        return { dir: 'bear', role: 'REVERSAL', momentum: revMom, name: isBear ? 'Shooting Star / Bear Pin Bar (Reversal)' : 'Upper Wick Rejection (Reversal)' };
    }

    if (bodyRatio >= 0.80) {
        return { dir: isBull ? 'bull' : 'bear', role: 'CONTINUATION', momentum: Math.min(99, Math.max(82, baseMomentum + 8)), name: isBull ? 'Bullish Marubozu (Strong Continuation)' : 'Bearish Marubozu (Strong Continuation)' };
    }
    if (bodyRatio >= 0.58) {
        return { dir: isBull ? 'bull' : 'bear', role: 'CONTINUATION', momentum: Math.min(94, Math.max(65, baseMomentum)), name: isBull ? 'Strong Bullish Candle (Continuation)' : 'Strong Bearish Candle (Continuation)' };
    }

    if (prev && c.high <= prev.high && c.low >= prev.low) {
        return { dir: 'neutral', role: 'COMPRESSION', momentum: Math.max(20, 40 + volBoost), name: 'Inside Bar / Harami (Compression)' };
    }

    return {
        dir: isBull ? 'bull' : (isBear ? 'bear' : 'neutral'),
        role: 'CONTINUATION',
        momentum: Math.max(25, Math.min(64, baseMomentum)),
        name: isBull ? 'Standard Bullish / Spinning Top' : (isBear ? 'Standard Bearish / Spinning Top' : 'Spinning Top / Doji')
    };
}

function evaluateMarketStructure(candles, idx) {
    let c = candles[idx];
    let prev = candles[idx - 1];
    let prev2 = candles[idx - 2];

    let lookbackStart = Math.max(0, idx - 10);
    let win = candles.slice(lookbackStart, idx);

    let swingHighs = [];
    let swingLows = [];
    for (let k = 1; k < win.length - 1; k++) {
        if (win[k].high >= win[k - 1].high && win[k].high >= win[k + 1].high) {
            swingHighs.push(win[k].high);
        }
        if (win[k].low <= win[k - 1].low && win[k].low <= win[k + 1].low) {
            swingLows.push(win[k].low);
        }
    }

    let maxWinHigh = Math.max(...win.map(x => x.high));
    let minWinLow = Math.min(...win.map(x => x.low));
    let bslPool = swingHighs.length > 0 ? Math.max(...swingHighs) : maxWinHigh;
    let sslPool = swingLows.length > 0 ? Math.min(...swingLows) : minWinLow;

    let tol = Math.max(0.5, (maxWinHigh - minWinLow) * 0.015);
    let hasEqualHighs = swingHighs.some((h1, a) => swingHighs.some((h2, b) => a !== b && Math.abs(h1 - h2) <= tol));
    let hasEqualLows = swingLows.some((l1, a) => swingLows.some((l2, b) => a !== b && Math.abs(l1 - l2) <= tol));

    let inducementHigh = prev2 ? Math.max(prev.high, prev2.high) : prev.high;
    let inducementLow = prev2 ? Math.min(prev.low, prev2.low) : prev.low;

    let sweptBSL = (c.high > bslPool || (prev && prev.high > bslPool)) && c.close < bslPool;
    let sweptSSL = (c.low < sslPool || (prev && prev.low < sslPool)) && c.close > sslPool;
    let sweptIDMHigh = c.high > inducementHigh && c.close < inducementHigh;
    let sweptIDMLow = c.low < inducementLow && c.close > inducementLow;

    let bullFVG = null;
    let bearFVG = null;
    if (prev2 && c.low > prev2.high) {
        bullFVG = { top: c.low, bottom: prev2.high, ce: (c.low + prev2.high) / 2 };
    }
    if (prev2 && c.high < prev2.low) {
        bearFVG = { top: prev2.low, bottom: c.high, ce: (prev2.low + c.high) / 2 };
    }

    let priorBullFVG = null;
    let priorBearFVG = null;
    if (idx >= 4) {
        let cA = candles[idx - 3];
        let cC = candles[idx - 1];
        if (cC.low > cA.high) priorBullFVG = { top: cC.low, bottom: cA.high, ce: (cC.low + cA.high) / 2 };
        if (cC.high < cA.low) priorBearFVG = { top: cA.low, bottom: cC.high, ce: (cA.low + cC.high) / 2 };
    }

    let mitigatedBullFVG = priorBullFVG && c.low <= priorBullFVG.top && c.close >= priorBullFVG.bottom;
    let mitigatedBearFVG = priorBearFVG && c.high >= priorBearFVG.bottom && c.close <= priorBearFVG.top;
    let invertedToBullFVG = priorBearFVG && c.close > priorBearFVG.top;
    let invertedToBearFVG = priorBullFVG && c.close < priorBullFVG.bottom;

    let closes = win.map(x => x.close);
    let maxClose = Math.max(...closes);
    let minClose = Math.min(...closes);
    let isRanging = (maxClose < maxWinHigh * 0.9985) && (minClose > minWinLow * 1.0015) && ((maxWinHigh - minWinLow) > 0);

    return {
        bslPool, sslPool, maxWinHigh, minWinLow,
        hasEqualHighs, hasEqualLows,
        inducementHigh, inducementLow,
        sweptBSL, sweptSSL, sweptIDMHigh, sweptIDMLow,
        bullFVG, bearFVG,
        mitigatedBullFVG, mitigatedBearFVG,
        invertedToBullFVG, invertedToBearFVG,
        isRanging
    };
}

function runTruthModeFlexible() {
    const output = document.getElementById("truthModeResults");
    try {
        const startVal = document.getElementById("truthStart").value;
        const endVal = document.getElementById("truthEnd").value;
        const startTime = startVal ? parseTimestampMs(startVal) : -Infinity;
        const endTime = endVal ? parseTimestampMs(endVal) : Infinity;

        let activeDatasets = {};
        let tfNames = ['5M', '15M', '30M', '1H', '4H', '1D'];

        tfNames.forEach(tf => {
            let val = document.getElementById("csv" + tf).value;
            let parsed = parseCSVText(val);
            if (parsed.length > 0) {
                activeDatasets[tf] = parsed;
            }
        });

        let activeKeys = Object.keys(activeDatasets);
        if (activeKeys.length === 0) {
            output.innerHTML = `<span style="color: #ff5252;">Error: Please paste valid CSV data into at least ONE timeframe box to run!</span>`;
            return;
        }

        let baseTf = activeDatasets['5M'] ? '5M' : (activeDatasets['15M'] ? '15M' : activeKeys[0]);
        let baseCandles = activeDatasets[baseTf].filter(c => c.time >= startTime && c.time <= endTime);

        if (baseCandles.length < 5) {
            output.innerHTML = `<span style="color: #ff5252;">Error: Need at least 5 candles in the selected date range for ${baseTf}. Check your dates or pasted CSV.</span>`;
            return;
        }

        let macroBias = 'NEUTRAL';
        let htfCandles = [];
        activeKeys.forEach(tf => {
            if (tf !== baseTf) htfCandles = htfCandles.concat(activeDatasets[tf]);
        });

        if (htfCandles.length > 0) {
            let recentHtf = htfCandles.slice(-8);
            let bullishCount = recentHtf.filter(c => c.close > c.open).length;
            macroBias = bullishCount > recentHtf.length / 2 ? 'BULLISH' : (bullishCount < recentHtf.length / 2 ? 'BEARISH' : 'NEUTRAL');
        }

        let vols = baseCandles.map(x => x.volume).filter(v => v > 0);
        let avgVol = vols.length > 0 ? vols.reduce((a, b) => a + b, 0) / vols.length : 0;

        let trades = [];
        let totalBuys = 0;
        let totalSells = 0;
        let zigzagLeg = 'DOWN';
        let lastPivotHigh = baseCandles[0].high;
        let lastPivotLow = baseCandles[0].low;
        let latestTrade = null;

        for (let i = 3; i < baseCandles.length; i++) {
            let c = baseCandles[i];
            let prev = baseCandles[i - 1];
            let prev2 = baseCandles[i - 2];

            let struct = evaluateMarketStructure(baseCandles, i);
            let candle = analyzeCandleMomentum(c, prev, prev2, avgVol);

            let isBullClose = c.close > c.open;
            let isBearClose = c.close < c.open;

            let priorHigh = lastPivotHigh;
            let priorLow = lastPivotLow;

            let printedNewHH = (c.high > priorHigh || c.close > priorHigh);
            let printedNewLL = (c.low < priorLow || c.close < priorLow);

            if (prev.high >= prev2.high && prev.high >= c.high) {
                lastPivotHigh = prev.high;
            }
            if (printedNewHH) {
                lastPivotHigh = Math.max(lastPivotHigh, c.high);
            }

            if (prev.low <= prev2.low && prev.low <= c.low) {
                lastPivotLow = prev.low;
            }
            if (printedNewLL) {
                lastPivotLow = Math.min(lastPivotLow, c.low);
            }

            let bullReversalSignal = printedNewHH && isBullClose && candle.role === 'REVERSAL' && candle.dir === 'bull' && candle.momentum >= 68 &&
                (struct.sweptSSL || struct.sweptIDMLow || struct.mitigatedBullFVG || struct.invertedToBullFVG || struct.bullFVG);

            let bearReversalSignal = printedNewLL && isBearClose && candle.role === 'REVERSAL' && candle.dir === 'bear' && candle.momentum >= 68 &&
                (struct.sweptBSL || struct.sweptIDMHigh || struct.mitigatedBearFVG || struct.invertedToBearFVG || struct.bearFVG);

            let bullContinuationSignal = printedNewHH && isBullClose && candle.role === 'CONTINUATION' && candle.dir === 'bull' && candle.momentum >= 72 &&
                (struct.bullFVG || struct.invertedToBullFVG || struct.sweptSSL) && macroBias !== 'BEARISH';

            let bearContinuationSignal = printedNewLL && isBearClose && candle.role === 'CONTINUATION' && candle.dir === 'bear' && candle.momentum >= 72 &&
                (struct.bearFVG || struct.invertedToBearFVG || struct.sweptBSL) && macroBias !== 'BULLISH';

            let signal = null;
            let modeTag = '';
            let tags = [];

            if (printedNewHH) tags.push(`New HH(>${priorHigh.toFixed(2)})`);
            if (printedNewLL) tags.push(`New LL(<${priorLow.toFixed(2)})`);
            if (struct.isRanging) tags.push(`Range[${struct.minWinLow.toFixed(2)}-${struct.maxWinHigh.toFixed(2)}]`);
            if (struct.sweptSSL) tags.push(`SSL Sweep(${struct.sslPool.toFixed(2)})`);
            if (struct.sweptBSL) tags.push(`BSL Sweep(${struct.bslPool.toFixed(2)})`);
            if (struct.sweptIDMLow) tags.push('IDM Low Sweep');
            if (struct.sweptIDMHigh) tags.push('IDM High Sweep');
            if (struct.hasEqualLows) tags.push('Equal Lows Pool');
            if (struct.hasEqualHighs) tags.push('Equal Highs Pool');
            if (struct.bullFVG) tag
